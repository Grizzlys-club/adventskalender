<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Floorball Mobile</title><style>*{box-sizing:border-box}body{margin:0;background:#081321;color:white;font-family:system-ui;overflow:hidden}header{height:48px;display:flex;align-items:center;justify-content:space-around;background:#101f35;font-weight:800}#menu{position:absolute;z-index:10;inset:48px 0 0;background:linear-gradient(145deg,#132a49,#081321);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:20px}h1{font-size:clamp(30px,9vw,54px);margin:0;color:#54edb2}button{border:0;background:#42e5a4;color:#09231b;border-radius:15px;font-size:18px;font-weight:900;padding:16px 28px;touch-action:manipulation}#game{display:block;width:100vw;height:calc(100dvh - 48px);touch-action:none}#controls{position:absolute;bottom:20px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}.pad,.actions{display:flex;gap:8px;align-items:end}.pad{width:125px;height:125px;border:2px solid #ffffff66;border-radius:50%;justify-content:center;align-items:center;background:#ffffff15}.nub{width:52px;height:52px;border-radius:50%;background:#ffffff80}.actions{flex-direction:column}.actions button{pointer-events:auto;font-size:14px;padding:12px;background:#ffffffdc}.actions button:first-child{background:#42e5a4}small{opacity:.7}</style></head><body><header><span>GRIZZLYS <b id="home">0</b></span><span id="clock">03:00</span><span><b id="away">0</b> RIVALS</span></header><canvas id="game"></canvas><div id="menu"><h1>FLOORBALL MOBILE</h1><p>5 gegen 5 · Mobile Unihockey<br><small>Touch-Joystick, Passen und Schiessen</small></p><button id="start" type="button">MATCH STARTEN</button><small>Am Computer: WASD/Pfeile · Leertaste Schuss · E Pass</small></div><div id="controls"><div class="pad" id="pad"><div class="nub" id="nub"></div></div><div class="actions"><button id="shoot">SCHUSS</button><button id="pass">PASS</button><button id="switch">WECHSEL</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),controls=document.getElementById('controls');let W=0,H=0,playing=false,last=0,time=180,score=[0,0],players=[],ball={x:0,y:0,vx:0,vy:0,owner:0},active=0,move={x:0,y:0},keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=(innerHeight-48)*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight-48}addEventListener('resize',resize);resize();function reset(){players=[];for(let team=0;team<2;team++)for(let i=0;i<5;i++)players.push({team,x:W*(team? .72:.28)+(i%2)*28,y:H*(.22+i*.14),vx:0,vy:0});active=0;ball={x:players[0].x,y:players[0].y,vx:0,vy:0,owner:0};time=180;score=[0,0];updateHUD()}function updateHUD(){document.getElementById('home').textContent=score[0];document.getElementById('away').textContent=score[1];document.getElementById('clock').textContent=Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0')}function kick(power){if(ball.owner<0||players[ball.owner].team!==0)return;let p=players[ball.owner],dx=W-p.x,dy=H/2-p.y,l=Math.hypot(dx,dy)||1;ball.x=p.x;ball.y=p.y;ball.vx=dx/l*power;ball.vy=dy/l*power;ball.owner=-1}function pass(){if(ball.owner<0||players[ball.owner].team!==0)return;let p=players[ball.owner],other=players.filter(q=>q.team===0&&q!==p).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(!other)return;let d=Math.hypot(other.x-p.x,other.y-p.y)||1;ball.x=p.x;ball.y=p.y;ball.vx=(other.x-p.x)/d*360;ball.vy=(other.y-p.y)/d*360;ball.owner=-1;active=players.indexOf(other)}function start(){reset();playing=true;menu.style.display='none';controls.style.display='flex';last=performance.now();requestAnimationFrame(loop)}document.getElementById('start').addEventListener('click',start);document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();kick(650)});document.getElementById('pass').addEventListener('pointerdown',e=>{e.preventDefault();pass()});document.getElementById('switch').addEventListener('pointerdown',e=>{e.preventDefault();active=(active+1)%5});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();kick(650)}if(e.key.toLowerCase()==='e')pass()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const pad=document.getElementById('pad'),nub=document.getElementById('nub');function joystick(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.max(1,Math.hypot(dx,dy)),m=Math.min(1,d/45);move={x:dx/d*m,y:dy/d*m};nub.style.transform='translate('+move.x*35+'px,'+move.y*35+'px)'}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);joystick(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)joystick(e)});function stop(){move={x:0,y:0};nub.style.transform=''}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);
function update(dt){time-=dt;if(time<=0){playing=false;menu.style.display='flex';controls.style.display='none';document.querySelector('#menu p').textContent='Endstand '+score[0]+' : '+score[1];document.getElementById('start').textContent='NOCHMALS SPIELEN';return}let p=players[active],dx=move.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=move.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),mag=Math.max(1,Math.hypot(dx,dy));p.x=clamp(p.x+dx/mag*230*dt,25,W-25);p.y=clamp(p.y+dy/mag*230*dt,25,H-25);players.forEach((q,i)=>{if(i===active) return;let tx=q.team===0?ball.x-35:ball.x+30,ty=ball.y+(i%5-2)*24;let vx=tx-q.x,vy=ty-q.y,d=Math.hypot(vx,vy)||1;q.x=clamp(q.x+vx/d*Math.min(d,95*dt),20,W-20);q.y=clamp(q.y+vy/d*Math.min(d,95*dt),20,H-20)});if(ball.owner>=0){let o=players[ball.owner];ball.x=o.x+(o.team===0?13:-13);ball.y=o.y+8;if(o.team===1&&Math.random()<dt*.55)kickAI(o)}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.986,dt*60);ball.vy*=Math.pow(.986,dt*60);if(ball.y<12||ball.y>H-12){ball.y=clamp(ball.y,12,H-12);ball.vy*=-.75}if(ball.x<10||ball.x>W-10){if(Math.abs(ball.y-H/2)<Math.min(60,H*.13)){score[ball.x>W/2?0:1]++;players.forEach((q,i)=>{q.x=W*(q.team?.72:.28)+(i%2)*28;q.y=H*(.22+(i%5)*.14)});ball.owner=score[0]+score[1] % 2 ? 5:0;ball.vx=ball.vy=0}else{ball.x=clamp(ball.x,10,W-10);ball.vx*=-.7}}for(let i=0;i<players.length;i++){if(Math.hypot(ball.x-players[i].x,ball.y-players[i].y)<19){ball.owner=i;if(i<5)active=i;break}}}updateHUD()}function kickAI(p){let d=Math.hypot(p.x,p.y-H/2)||1;ball.owner=-1;ball.vx=-p.x/d*430;ball.vy=(H/2-p.y)/d*430}
function draw(){ctx.fillStyle='#136d6b';ctx.fillRect(0,0,W,H);for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#ffffff08':'#00000008';ctx.fillRect(i*W/8,0,W/8,H)}ctx.strokeStyle='#ffffffbb';ctx.lineWidth=2;ctx.strokeRect(12,12,W-24,H-24);ctx.beginPath();ctx.moveTo(W/2,12);ctx.lineTo(W/2,H-12);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*.12,0,7);ctx.stroke();ctx.fillStyle='#e9f7ff';ctx.fillRect(3,H/2-55,12,110);ctx.fillRect(W-15,H/2-55,12,110);players.forEach((p,i)=>{ctx.save();ctx.translate(p.x,p.y);if(i===active){ctx.strokeStyle='#ffe36e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,19,0,7);ctx.stroke()}ctx.strokeStyle='#e6d9aa';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.team?0:0,0);ctx.lineTo(p.team?-19:19,13);ctx.stroke();ctx.fillStyle=p.team?'#ef5667':'#51aaff';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(String(i%5+1),0,3);ctx.restore()});ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,5,0,7);ctx.fill()}function loop(now){if(!playing)return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();if(playing)requestAnimationFrame(loop)}draw();})();
</script></body></html>
