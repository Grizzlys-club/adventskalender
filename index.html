<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07121d"><title>FLOORBALL MOBILE</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:0;background:#081a2dee;border:1px solid #ffffff35;border-radius:0 0 18px 18px;box-shadow:0 10px 30px #0008;z-index:2;white-space:nowrap}.hud span{padding:10px 12px;font-size:12px;font-weight:900}.hud strong{font-size:21px;background:#e8f9ff;color:#081525;padding:8px 14px}.hud #timer{background:#19e4a0;color:#08241c;font-size:13px}.pause{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:4;border:1px solid #ffffff55;background:#0b2438cc;color:white;border-radius:10px;padding:9px 12px;font-size:18px}.menu{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 25%,#18546a,#06111d 75%);padding:20px;text-align:center}.panel{width:min(440px,100%);padding:28px 18px;background:#071827d9;border:1px solid #43f2c54d;border-radius:24px;box-shadow:0 30px 80px #000a}.eyebrow{color:#55ffd0;font-weight:900;letter-spacing:4px;font-size:12px}h1{font-size:clamp(35px,10vw,58px);line-height:.95;margin:16px 0;letter-spacing:-2px}h1 em{font-style:normal;color:#50efb4}.subtitle{font-size:14px;color:#b7c8d5;line-height:1.6;margin:16px 0 24px}button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#start,#resume{background:linear-gradient(120deg,#3df5a4,#18c8cf);color:#06231c;border:0;border-radius:13px;padding:17px 35px;font-size:17px;font-weight:1000;box-shadow:0 8px 28px #20edab55}#resume{display:none}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px}.chips span{font-size:11px;border:1px solid #ffffff35;padding:7px 10px;border-radius:30px;color:#d2e3ec}.control{display:none;position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:3;pointer-events:none;width:100%;padding:0 20px;justify-content:space-between;align-items:end}.stick{width:128px;height:128px;border-radius:50%;border:2px solid #ffffff80;background:#07182788;display:grid;place-items:center;pointer-events:auto;touch-action:none}.knob{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e8ffffb8,#7ad4ff88);border:2px solid white;box-shadow:0 0 20px #fff3}.buttons{display:grid;grid-template-columns:repeat(2,68px);gap:9px;pointer-events:auto}.buttons button{height:64px;border-radius:50%;border:2px solid #ffffffaa;background:#123047e8;color:white;font-weight:900;font-size:11px;box-shadow:0 6px 18px #0009}.buttons #shoot{background:#42f3b0;color:#07241c;border-color:#d3ffeb;grid-column:2}.buttons #pass{background:#47aaff}.buttons #sprint{background:#ffc65a;color:#2b1b05}.status{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 167px);left:50%;transform:translateX(-50%);z-index:2;font-size:11px;letter-spacing:1px;color:#fff9;text-align:center;white-space:nowrap}.toast{position:absolute;top:23%;left:50%;transform:translate(-50%,-50%);z-index:4;font-size:clamp(28px,8vw,55px);font-weight:1000;color:#fff;text-shadow:0 4px 25px #000;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}@media(min-width:850px){.control{padding:0 65px}.stick{width:145px;height:145px}.buttons{grid-template-columns:repeat(2,78px)}.buttons button{height:75px}}
</style></head><body><canvas id="pitch"></canvas><div class="hud"><span>GRIZZLYS</span><strong id="s1">0</strong><span id="timer">03:00</span><strong id="s2">0</strong><span>RIVALS</span></div><button class="pause" id="pause" aria-label="Pause">Ⅱ</button><div class="toast" id="toast">TOR!</div><div class="status" id="status">OXDOG • FAT PIPE • UNIHOC • ZONE | ALPHA ARENA</div><div class="control" id="control"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="buttons"><button id="switch">WECHSEL</button><button id="shoot">SCHUSS</button><button id="sprint">SPRINT</button><button id="pass">PASS</button></div></div><div class="menu" id="menu"><div class="panel"><div class="eyebrow">NEXT GENERATION FLOORBALL</div><h1>FLOORBALL<br><em>MOBILE</em></h1><div class="subtitle" id="intro">Spiele ein schnelles 5-gegen-5-Unihockeymatch mit Torhütern, Gegner-KI, Pässen, Schüssen und Touch-Steuerung.</div><button id="start">MATCH STARTEN</button><button id="resume">WEITERSPIELEN</button><div class="chips"><span>5 VS 5</span><span>TOUCH CONTROLS</span><span>3 MIN MATCH</span><span>ARENA EDITION</span><span>LIVE ACTION</span></div></div></div><script>
(()=>{'use strict';
const c=document.getElementById('pitch'),g=c.getContext('2d'),menu=document.getElementById('menu'),control=document.getElementById('control'),toast=document.getElementById('toast');let w=0,h=0,dpr=1,players=[],ball,selected=0,playing=false,clock=180,scores=[0,0],last=0,shotCooldown=0,flash=0,sprint=false,stamina=100,shotCharge=0,chargeActive=false,goalkeeperCooldown=0,matchEvents=0,joy={x:0,y:0},keys={},messageUntil=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),F={x:0,y:0,w:1000,h:560};function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function project(x,y,z=0){let scale=Math.min((w-20)/1070,(h-90)/640);let tilt=Math.min(.35,Math.max(.12,(h-w*.45)/h*.23));return{x:w/2+(x-500)*scale,y:h/2+(y-280)*scale*(1-tilt)+(x-500)*scale*.06-z*scale*.75,s:scale}}function line(x1,y1,x2,y2){let a=project(x1,y1),b=project(x2,y2);g.moveTo(a.x,a.y);g.lineTo(b.x,b.y)}function poly(points,fill,stroke){g.beginPath();points.forEach(([x,y],i)=>{let p=project(x,y);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.stroke()}}
function resetPositions(){players=[];for(let team=0;team<2;team++){let xs=team? [850,680,680,560,560]:[150,320,320,440,440],ys=[280,160,400,190,370];for(let i=0;i<5;i++)players.push({team,x:xs[i],y:ys[i],angle:team?Math.PI:0,number:i+1,speed:i===0?120:210,stick:['OXDOG','FAT PIPE','UNIHOC','ZONE'][i%4]})}ball={x:500,y:280,vx:0,vy:0,owner:-1};selected=3;shotCooldown=0;stamina=100;goalkeeperCooldown=0}function reset(){scores=[0,0];clock=180;resetPositions();hud()}function hud(){document.getElementById('s1').textContent=scores[0];document.getElementById('s2').textContent=scores[1];document.getElementById('timer').textContent=Math.floor(clock/60)+':'+String(Math.floor(clock%60)).padStart(2,'0')}function show(t){toast.textContent=t;toast.classList.add('show');messageUntil=performance.now()+1000}function start(){reset();menu.style.display='none';control.style.display='flex';playing=true;last=performance.now();requestAnimationFrame(frame);show('ANPFIFF!')}function pause(){if(!playing)return;playing=false;menu.style.display='flex';control.style.display='none';document.getElementById('intro').textContent='Das Match ist pausiert.';document.getElementById('start').style.display='none';document.getElementById('resume').style.display='inline-block'}function resume(){menu.style.display='none';control.style.display='flex';playing=true;last=performance.now();requestAnimationFrame(frame)}document.getElementById('start').onclick=start;document.getElementById('pause').onclick=pause;document.getElementById('resume').onclick=resume;
function shoot(power=850){if(shotCooldown>0)return;let p=players[selected];if(ball.owner!==selected&&dist(p,ball)>55)return;let dx=1000-p.x,dy=280-p.y+(joy.y*115);let len=Math.hypot(dx,dy)||1;ball.owner=-1;ball.x=p.x+dx/len*25;ball.y=p.y+dy/len*25;ball.vx=dx/len*power;ball.vy=dy/len*power+ rnd(-35,35);shotCooldown=.35;show(power>1000?'POWER SHOT!':'SCHUSS!')}function pass(){let p=players[selected];if(ball.owner!==selected&&dist(p,ball)>50)return;let mates=players.slice(0,5).filter(q=>q!==p).sort((a,b)=>Math.abs(a.x-p.x-140)-Math.abs(b.x-p.x-140));let q=mates[0];if(!q)return;let dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy)||1;ball.owner=-1;ball.x=p.x;ball.y=p.y;ball.vx=dx/len*640;ball.vy=dy/len*640;selected=players.indexOf(q);shotCooldown=.18}function switchPlayer(){if(ball.owner>=0&&ball.owner<5){selected=ball.owner;return}selected=(selected+1)%5}
const shootButton=document.getElementById('shoot');shootButton.onpointerdown=e=>{e.preventDefault();chargeActive=true;shotCharge=performance.now();shootButton.setPointerCapture(e.pointerId)};shootButton.onpointerup=e=>{e.preventDefault();if(chargeActive)shoot(Math.min(1250,740+(performance.now()-shotCharge)*.6));chargeActive=false};shootButton.onpointercancel=()=>chargeActive=false;document.getElementById('pass').onpointerdown=e=>{e.preventDefault();pass()};document.getElementById('switch').onpointerdown=e=>{e.preventDefault();switchPlayer()};const sprintButton=document.getElementById('sprint');sprintButton.onpointerdown=e=>{e.preventDefault();sprint=true;sprintButton.setPointerCapture(e.pointerId)};sprintButton.onpointerup=sprintButton.onpointercancel=()=>sprint=false;
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(!e.repeat&&k===' ')shoot();if(!e.repeat&&k==='e')pass();if(!e.repeat&&k==='q')switchPlayer();if(!e.repeat&&k==='escape')pause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const pad=document.getElementById('stick'),knob=document.getElementById('knob');function movePad(e){let r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(dx,dy)),m=Math.min(1,l/45);joy={x:dx/l*m,y:dy/l*m};knob.style.transform='translate('+joy.x*35+'px,'+joy.y*35+'px)'}pad.onpointerdown=e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);movePad(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))movePad(e)};pad.onpointerup=pad.onpointercancel=()=>{joy={x:0,y:0};knob.style.transform=''};
function goal(team){scores[team]++;hud();show(team===0?'TOOOOR GRIZZLYS!':'TOR RIVALS!');flash=.7;resetPositions();ball.owner=team===0?6:3}function opponentShoot(p){let dx=-p.x,dy=280-p.y,l=Math.hypot(dx,dy)||1;ball.owner=-1;ball.x=p.x;ball.y=p.y;ball.vx=dx/l*720;ball.vy=dy/l*720+rnd(-90,90);shotCooldown=.5}
function tick(dt){clock-=dt;goalkeeperCooldown=Math.max(0,goalkeeperCooldown-dt);shotCooldown=Math.max(0,shotCooldown-dt);flash=Math.max(0,flash-dt);if(clock<=0){playing=false;menu.style.display='flex';control.style.display='none';document.getElementById('intro').textContent='ABPFIFF! Endstand: GRIZZLYS '+scores[0]+' : '+scores[1]+' RIVALS';document.getElementById('start').textContent='NEUES MATCH';document.getElementById('start').style.display='inline-block';document.getElementById('resume').style.display='none';return}let p=players[selected],mx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),mag=Math.max(1,Math.hypot(mx,my));if(Math.abs(mx)+Math.abs(my)>.04){let running=(sprint||keys.shift)&&stamina>1;stamina=clamp(stamina+(running?-28:12)*dt,0,100);p.x=clamp(p.x+mx/mag*(running?325:240)*dt,35,965);p.y=clamp(p.y+my/mag*(running?325:240)*dt,35,525);p.angle=Math.atan2(my,mx)}
for(let i=0;i<players.length;i++){if(i===selected)continue;let q=players[i],target=ball.owner>=0?players[ball.owner]:ball;let tx,ty;if(q.team===0){tx=clamp(target.x-90-(i%2)*50,100,870);ty=clamp(target.y+(i%5-2)*60,65,495)}else{tx=clamp(target.x+50+(i%2)*45,90,910);ty=clamp(target.y+(i%5-2)*52,55,505)}let dx=tx-q.x,dy=ty-q.y,len=Math.hypot(dx,dy)||1,speed=q.team===1?165:125;q.x=clamp(q.x+dx/len*Math.min(len,speed*dt),30,970);q.y=clamp(q.y+dy/len*Math.min(len,speed*dt),30,530);if(len>8)q.angle=Math.atan2(dy,dx)}
if(ball.owner>=0){let o=players[ball.owner];ball.x=o.x+Math.cos(o.angle)*23;ball.y=o.y+Math.sin(o.angle)*23;if(o.team===1&&shotCooldown===0&&(o.x<370||Math.random()<dt*.22))opponentShoot(o)}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.986,dt*60);ball.vy*=Math.pow(.986,dt*60);if(ball.y<25||ball.y>535){ball.y=clamp(ball.y,25,535);ball.vy*=-.7}if(ball.x<10||ball.x>990){if(Math.abs(ball.y-280)<65){goal(ball.x>500?0:1);return}ball.x=clamp(ball.x,10,990);ball.vx*=-.65}
for(let i=0;i<players.length;i++){if(dist(players[i],ball)<27&&shotCooldown<=0){ball.owner=i;if(i<5)selected=i;break}}}
if(ball.owner===-1&&goalkeeperCooldown<=0){for(const side of [0,1]){let gx=side?958:42,going=side?ball.vx>0:ball.vx<0;if(going&&Math.abs(ball.x-gx)<17&&Math.abs(ball.y-280)<43&&Math.random()<.66){ball.vx*=-.8;ball.vy+=(ball.y-280)*2.8;goalkeeperCooldown=.65;show('PARADE!');break}}}
hud()}
function circle(x,y,r,color,stroke){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function draw(){let bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#061320');bg.addColorStop(1,'#102d39');g.fillStyle=bg;g.fillRect(0,0,w,h);for(let i=0;i<80;i++){g.fillStyle=i%4===0?'#40c6b5':i%3===0?'#7c9daf':'#243b50';g.fillRect(i*w/80,0,w/80+1,h*.12)}g.fillStyle='#051521';g.fillRect(0,h*.12,w,h*.035);for(let i=0;i<14;i++){g.fillStyle=i%2?'#f5faff':'#18d9ab';g.fillRect(i*w/14,h*.13,w/14-3,h*.02)}poly([[0,0],[1000,0],[1000,560],[0,560]],'#c7b28b','#e8edf0');for(let j=0;j<10;j++)poly([[j*100,0],[(j+1)*100,0],[(j+1)*100,560],[j*100,560]],j%2?'#e3d0a7':'#dfc9a1');g.strokeStyle='#f9f9f8';g.lineWidth=2.4;g.beginPath();line(0,0,1000,0);line(1000,0,1000,560);line(1000,560,0,560);line(0,560,0,0);line(500,0,500,560);g.stroke();let center=project(500,280),radius=project(580,280).x-center.x;g.beginPath();g.ellipse(center.x,center.y,radius,radius*.82,0,0,Math.PI*2);g.strokeStyle='#d8545c';g.lineWidth=2.5;g.stroke();for(let x of [120,880]){let pt=project(x,280),r=Math.abs(project(x+78,280).x-pt.x);g.beginPath();g.ellipse(pt.x,pt.y,r,r*.8,0,0,Math.PI*2);g.strokeStyle='#cf5260';g.stroke()}for(let x of [0,1000]){let a=project(x,220),b=project(x,340);g.strokeStyle='#efefff';g.lineWidth=5;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.strokeStyle='#d94354';g.lineWidth=3;g.strokeRect(Math.min(a.x,b.x)-3,a.y-10,Math.abs(a.x-b.x)+6,b.y-a.y+20)}
let sorted=[...players].sort((a,b)=>a.y-b.y);for(let q of sorted){let p=project(q.x,q.y),s=p.s;circle(p.x,p.y+5,15*s,'#0004');g.strokeStyle='#a48a5b';g.lineWidth=Math.max(2,3*s);g.beginPath();g.moveTo(p.x,p.y-14*s);g.lineTo(p.x+Math.cos(q.angle)*31*s,p.y+Math.sin(q.angle)*25*s);g.stroke();circle(p.x,p.y-9*s,13*s,q.team?'#e63d55':'#2677d9','#ffffff');circle(p.x,p.y-21*s,7*s,'#f0c8a0');g.fillStyle='white';g.font='bold '+Math.max(9,11*s)+'px system-ui';g.textAlign='center';g.fillText(q.number,p.x,p.y-5*s);if(q===players[selected]){g.strokeStyle='#ffe64e';g.lineWidth=3;g.beginPath();g.ellipse(p.x,p.y+4,21*s,11*s,0,0,Math.PI*2);g.stroke();g.fillStyle='#ffe64e';g.beginPath();g.moveTo(p.x,p.y-41*s);g.lineTo(p.x-7*s,p.y-51*s);g.lineTo(p.x+7*s,p.y-51*s);g.fill()}}
for(let x of [48,952]){let y=280,p=project(x,y),s=p.s;g.fillStyle='#071b2e';g.beginPath();g.ellipse(p.x,p.y,25*s,18*s,0,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.fillStyle=x<500?'#2d8ce8':'#ed4d66';g.fillRect(p.x-16*s,p.y-15*s,32*s,14*s)}
let bp=project(ball.x,ball.y,5);circle(bp.x+2,bp.y+3,7*bp.s,'#0005');circle(bp.x,bp.y,6*bp.s,'#fff','#333');if(playing){let barw=Math.min(160,w*.35),bx=w/2-barw/2,by=h-16;g.fillStyle='#031520c9';g.fillRect(bx-4,by-5,barw+8,13);g.fillStyle=stamina>30?'#40e9b0':'#ffae51';g.fillRect(bx,by,barw*stamina/100,4);g.fillStyle='#fff';g.textAlign='center';g.font='bold 10px system-ui';g.fillText('ENERGIE',w/2,by-10);if(chargeActive){let charge=clamp((performance.now()-shotCharge)/850,0,1);g.fillStyle='#031520e8';g.fillRect(bx,by-35,barw,10);g.fillStyle='#ffce4c';g.fillRect(bx,by-35,barw*charge,10);g.fillStyle='#fff';g.fillText('SCHUSSKRAFT',w/2,by-40)}}if(flash>0){g.fillStyle='rgba(255,255,255,'+(flash*.32)+')';g.fillRect(0,0,w,h)}}
function frame(now){if(!playing)return;let dt=Math.min(.04,(now-last)/1000||0);last=now;tick(dt);draw();if(now>messageUntil)toast.classList.remove('show');if(playing)requestAnimationFrame(frame)}reset();draw();
})();
</script></body></html>
